name: Release v1.0.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.0.1.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release
        env:
          TARGET_SHA: 2425fb775c4a72984fef8e4cc8a6365973be4072
        run: |
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          git diff --quiet "$TARGET_SHA" HEAD -- . \
            ':(exclude).github/workflows/release-v1.0.1.yml'
          test "$(sed -n 's/^VERSION=//p' RELEASE)" = "1.0.1"
          test "$(sed -n 's/^COMMIT=//p' RELEASE)" = "9176eced9765cc99cef9a6263f3b1cbc0c12b4a0"
          printf '%s  %s\n' \
            "$(sed -n 's/^WATCHDOG_SHA256=//p' RELEASE)" wg-watchdog.sh \
            "$(sed -n 's/^MANAGER_SHA256=//p' RELEASE)" wg-watchdog-manager.sh | sha256sum -c -
          sh -n install.sh wg-watchdog.sh wg-watchdog-manager.sh tests/run.sh
          dash -n install.sh wg-watchdog.sh wg-watchdog-manager.sh tests/run.sh
          sh tests/run.sh
          python3 tests/terminal.py

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 2425fb775c4a72984fef8e4cc8a6365973be4072
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.0.1 "$TARGET_SHA" -m "WG Watchdog Manager v1.0.1"
          git push origin refs/tags/v1.0.1
          gh release create v1.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WG Watchdog Manager v1.0.1" \
            --notes "$(printf '%s\n' \
              '- Непрерывный мастер настройки с понятными действиями Enter.' \
              '- Короткие системные имена интерфейсов и безопасная подсказка адреса сервера.')"

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/release-v1.0.1.yml
          git commit -m "Remove one-time v1.0.1 release workflow"
          git push origin HEAD:main
