name: Finalize v1.8.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-v1.8.0.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release candidate
        env:
          RELEASE_COMMIT: b4ca203e60c256f992b33ad0811ca5071efdff47
          WATCHDOG_SHA256: 4a22bbbb42764ab1c6a3a5ef9821cb200fc256e4a1d09caa2b806c29d3d27686
          MANAGER_SHA256: 448970d8ac807cb55d0448539090041ba76ec5783b093af41358c3eb82443a22
        run: |
          test "$(sed -n 's/^VERSION=//p' RELEASE)" = "1.8.0"
          test "$(sed -n 's/^COMMIT=//p' RELEASE)" = "$RELEASE_COMMIT"
          test "$(sed -n 's/^WATCHDOG_SHA256=//p' RELEASE)" = "$WATCHDOG_SHA256"
          test "$(sed -n 's/^MANAGER_SHA256=//p' RELEASE)" = "$MANAGER_SHA256"
          test "$(git show "$RELEASE_COMMIT:wg-watchdog.sh" | sha256sum | awk '{print $1}')" = "$WATCHDOG_SHA256"
          test "$(git show "$RELEASE_COMMIT:wg-watchdog-manager.sh" | sha256sum | awk '{print $1}')" = "$MANAGER_SHA256"
          sh -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          sudo dash tests/run.sh
          python3 tests/terminal.py

      - name: Create annotated tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: bcd646fcd36e33bf95ae04deb5e992f29ec49986
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.8.0 "$TARGET_SHA" -m "WG Watchdog v1.8.0"
          git push origin v1.8.0
          cat > /tmp/release-notes.md <<'EOF'
          ## Изменения

          - Конфигурации заданий теперь читаются как данные и больше не исполняются через shell.
          - Неизвестные и повторяющиеся ключи, команды, небезопасные символы и числа с ведущими нулями отклоняются.
          - Во всех операциях проверяется совпадение имени файла, `JOB_ID` и WireGuard-интерфейса.
          - Числовые параметры сведены в единую схему значений, диапазонов и русских описаний.
          - Менеджер и watchdog принимают одинаковый точный набор интервалов, совместимых с cron.
          - Результаты действий унифицированы для успеха, предупреждения, ошибки и отмены.
          - Добавлен постоянный CI с `sh`, `dash`, BusyBox `ash`, ShellCheck и PTY-проверками.
          - Добавлена инструкция ручной приёмки на реальном Keenetic.
          - Автоматический стенд расширен до 79 функциональных и 6 терминальных проверок.
          EOF
          gh release create v1.8.0 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WG Watchdog v1.8.0" \
            --notes-file /tmp/release-notes.md

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/finalize-v1.8.0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove one-time v1.8.0 release workflow"
          git push origin HEAD:main
