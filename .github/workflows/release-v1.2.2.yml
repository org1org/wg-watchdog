name: Release v1.2.2

on:
  push:
    paths:
      - .github/workflows/release-v1.2.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release v1.2.2
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 60e95b0b9ed4001876aea23b7c9691dd5436807f
        run: |
          cat > /tmp/v1.2.2.md <<'EOF'
          ## Изменения

          - После приветствия добавлено подтверждение продолжения; Enter означает «да».
          - Информационные сообщения выделены зелёным цветом.
          - Добавлены пустые строки между сообщениями менеджера и выводом системных команд.
          - Внешний адрес сервера автоматически извлекается из endpoint выбранного WireGuard-пира.
          - Внутренний адрес сервера автоматически извлекается из одиночного маршрута /32 в allow-ips.
          - При нескольких пирах менеджер предлагает выбрать нужный.
          - Поддержано извлечение IPv4, DNS и IPv6 endpoint без номера порта.
          - При невозможности однозначного определения адрес остаётся доступен ручной ввод.
          - Набор автоматических mock-тестов расширен до 24 сценариев.
          EOF

          gh release create v1.2.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "WG Watchdog v1.2.2" \
            --notes-file /tmp/v1.2.2.md
