name: Finalize v1.8.3

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-v1.8.3.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить манифест и файлы релиза
        run: |
          set -eu
          . ./RELEASE
          test "$VERSION" = "1.8.3"
          test "$COMMIT" = "27f9979322d49b18ccff1fa6f3435991033b5b16"
          test "$WATCHDOG_SHA256" = "1179e00fa2ce0aa0310d2f4f3e253e0adf4fcd83da958ef4280773836af7c1f0"
          test "$MANAGER_SHA256" = "3fe19eabc311f18da066e18b4d4586141caa4cc3259edb4d0aacaeaec9754db7"
          git cat-file -e "$COMMIT^{commit}"
          test "$(git show "$COMMIT:wg-watchdog.sh" | sha256sum | awk '{print $1}')" = "$WATCHDOG_SHA256"
          test "$(git show "$COMMIT:wg-watchdog-manager.sh" | sha256sum | awk '{print $1}')" = "$MANAGER_SHA256"
          grep -Fx 'VERSION="1.8.3"' install.sh
          grep -Fx 'VERSION="1.8.3"' wg-watchdog-manager.sh
          grep -Fx 'VERSION="1.8.3"' wg-watchdog.sh

      - name: Запустить тесты
        run: |
          set -eu
          sh -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          dash -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          bash -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          sudo dash tests/run.sh
          python3 tests/terminal.py

      - name: Создать аннотированный тег и релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.8.3 "$GITHUB_SHA" -m "WG Watchdog v1.8.3"
          git push origin refs/tags/v1.8.3
          gh release create v1.8.3 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WG Watchdog v1.8.3" \
            --notes "$(printf '%s\n' \
              '- При выборе уже найденного обновления менеджер сообщает, что повторно проверяет наличие новой версии.' \
              '- Подтверждение установки теперь использует [Y/n]: нажатие Enter запускает обновление.' \
              '- Добавлен автоматический тест полного диалога обновления и перехода к установке.' \
              '- Пройдены 86 функциональных и 7 терминальных проверок.')"

      - name: Удалить одноразовый workflow
        run: |
          set -eu
          git rm .github/workflows/finalize-v1.8.3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove one-time v1.8.3 release workflow"
          git push origin HEAD:main
