name: Release v1.2.3

on:
  push:
    paths:
      - .github/workflows/release-v1.2.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release v1.2.3
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 6291230f1fccee0839e34b5baeb5e56fd3324c5e
        run: |
          cat > /tmp/v1.2.3.md <<'EOF'
          ## Изменения

          - Публичная проверка для нового задания теперь выключена по умолчанию.
          - Перед её включением показывается краткое описание механизма и риска блокировки ICMP.
          - Найденный Endpoint предлагается только после явного ответа yes.
          - При редактировании уже включённая публичная проверка сохраняется через вопрос с ответом yes по умолчанию.
          - Все обозначения подтверждений унифицированы как [y/N] и [Y/n].
          - Настроенные задания выделяются зелёным цветом.
          - Задания нумеруются с точкой, а пункты действий — со скобкой.
          - При редактировании задания WireGuard-интерфейс больше не запрашивается повторно.
          - Добавлены полные автоматические тесты интерактивных диалогов.
          - Общее количество mock-сценариев увеличено до 28.
          EOF

          gh release create v1.2.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "WG Watchdog v1.2.3" \
            --notes-file /tmp/v1.2.3.md
