name: Release v1.5.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.5.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить версию и тесты
        run: |
          test "$(cat VERSION)" = "1.5.1"
          test "$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' install.sh | head -n 1)" = "1.5.1"
          test "$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' wg-watchdog-manager.sh | head -n 1)" = "1.5.1"
          test "$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' wg-watchdog.sh | head -n 1)" = "1.5.1"
          sudo dash tests/run.sh
          python3 tests/terminal.py

      - name: Создать тег и релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: fa4ea223168ee6fe0ef45affe7b1d60e5be41663
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Изменения

          - Исправлен запуск менеджера на файловых системах Entware, которые отображают для `/opt` UID, отличный от `0`.
          - Каталог конфигурации принимается, если его владелец совпадает с владельцем файловой системы Entware.
          - Проверки символических ссылок, типа каталога и небезопасных прав доступа сохранены.
          - Добавлен отдельный сценарий для смонтированной `/opt` с отображаемым UID.
          - Автоматический стенд включает 56 функциональных и 6 терминальных проверок.
          EOF
          gh release create v1.5.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "WG Watchdog v1.5.1" \
            --notes-file /tmp/release-notes.md

      - name: Удалить одноразовый workflow
        run: |
          rm -f .github/workflows/release-v1.5.1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-v1.5.1.yml
          git commit -m "Remove one-time v1.5.1 release workflow"
          git push origin HEAD:main
