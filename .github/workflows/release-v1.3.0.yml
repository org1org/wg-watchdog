name: Release v1.3.0

on:
  push:
    paths:
      - .github/workflows/release-v1.3.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release v1.3.0
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 683f85253b614f07e25bf8694f946dfa546a1297
        run: |
          cat > /tmp/v1.3.0.md <<'EOF'
          ## Изменения

          - Добавлена короткая команда `wgwm` для запуска установленного менеджера.
          - Команда создаётся только если имя свободно; существующий файл или команда не перезаписываются.
          - Установщик разделён на компактный загрузчик и автономный менеджер.
          - При запуске по установочной ссылке убран повторный предупреждающий вопрос.
          - Добавлена шапка с описанием назначения, автором и текущей версией.
          - Менеджер проверяет небольшой файл `VERSION` и заметно сообщает о новой версии.
          - Обновление выполняется только по выбору пользователя из меню.
          - Перед основным меню выводятся найденные WireGuard-интерфейсы и их описания.
          - При отсутствии заданий показывается сокращённое меню; после создания задания — полное.
          - Проверка обновлений и временные загрузки выполняются в `/tmp`, без лишних записей на накопитель.
          - Автоматический стенд расширен до 34 проверок.
          EOF

          gh release create v1.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "WG Watchdog v1.3.0" \
            --notes-file /tmp/v1.3.0.md
