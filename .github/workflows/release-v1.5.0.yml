name: Release v1.5.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.5.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить версию и тесты
        run: |
          test "$(cat VERSION)" = "1.5.0"
          test "$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' install.sh | head -n 1)" = "1.5.0"
          test "$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' wg-watchdog-manager.sh | head -n 1)" = "1.5.0"
          test "$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' wg-watchdog.sh | head -n 1)" = "1.5.0"
          dash tests/run.sh
          python3 tests/terminal.py

      - name: Создать тег и релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 9dedb0903e394b04f25baead8da3d1f36d323c8e
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Изменения

          - Добавлен полноэкранный интерфейс менеджера без новых зависимостей Entware.
          - Вывод переносится по ширине терминала, а длинные списки заданий разбиваются на страницы.
          - Добавлен просмотр всех найденных WireGuard-интерфейсов и режим `wgwm --plain`.
          - Терминал восстанавливается после выхода и сигналов прерывания.
          - Одновременный запуск двух менеджеров блокируется.
          - Изменение и удаление заданий согласовано с выполняющимися проверками watchdog.
          - Добавлено безопасное восстановление блокировок после завершившихся процессов.
          - Команда `wgwm --uninstall` удаляет программу без предварительной установки зависимостей.
          - При частичном удалении выводится ошибка вместо сообщения об успешном завершении.
          - Рабочие каталоги проверяются на ссылки, владельца и небезопасные права доступа.
          - Часто изменяемые блокировки и служебные маркеры остаются в `/tmp` и не увеличивают износ накопителя.
          - Проведён рефакторинг диалогов, временных файлов, обработки сигналов и работы с cron.
          - Автоматический стенд расширен до 55 функциональных и 6 терминальных сценариев.
          EOF
          gh release create v1.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "WG Watchdog v1.5.0" \
            --notes-file /tmp/release-notes.md

      - name: Удалить одноразовый workflow
        run: |
          rm -f .github/workflows/release-v1.5.0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-v1.5.0.yml
          git commit -m "Remove one-time v1.5.0 release workflow"
          git push origin HEAD:main
