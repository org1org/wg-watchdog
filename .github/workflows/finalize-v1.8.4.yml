name: Finalize v1.8.4

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-v1.8.4.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить манифест и файлы релиза
        run: |
          set -eu
          . ./RELEASE
          test "$VERSION" = "1.8.4"
          test "$COMMIT" = "e9c0afe14bdccd797672bac4f50196ce300b718f"
          test "$WATCHDOG_SHA256" = "87fb1a52b2716b02c0538360d572e81670843fe5e770688381b310d14e0469b3"
          test "$MANAGER_SHA256" = "8761ca863efdc1469653c414381029ddaf1e2ab0bf271be8affbecdcc3b33fde"
          git cat-file -e "$COMMIT^{commit}"
          test "$(git show "$COMMIT:wg-watchdog.sh" | sha256sum | awk '{print $1}')" = "$WATCHDOG_SHA256"
          test "$(git show "$COMMIT:wg-watchdog-manager.sh" | sha256sum | awk '{print $1}')" = "$MANAGER_SHA256"
          grep -Fx 'VERSION="1.8.4"' install.sh
          grep -Fx 'VERSION="1.8.4"' wg-watchdog-manager.sh
          grep -Fx 'VERSION="1.8.4"' wg-watchdog.sh

      - name: Запустить тесты
        run: |
          set -eu
          sh -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          dash -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          bash -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          sudo dash tests/run.sh
          python3 tests/terminal.py

      - name: Создать аннотированный тег и релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.8.4 "$GITHUB_SHA" -m "WG Watchdog v1.8.4"
          git push origin refs/tags/v1.8.4
          gh release create v1.8.4 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WG Watchdog v1.8.4" \
            --notes "$(printf '%s\n' \
              '- Подсказки для просмотра журнала используют штатную команду KeeneticOS через ndmc; зависимость от отсутствующего logread удалена.' \
              '- Пояснение публичной проверки и вопрос подтверждения остаются на одной странице полноэкранного интерфейса.' \
              '- Менеджер обнаруживает фиксированный локальный ListenPort на клиентском WireGuard-интерфейсе и предупреждает о возможной помехе восстановлению туннеля.' \
              '- В подробном статусе задания показывается автоматический или фиксированный локальный порт.' \
              '- Настройки WireGuard автоматически не изменяются; порт удалённого сервера Endpoint не затрагивается.' \
              '- Пройдены 89 функциональных и 7 терминальных проверок.')"

      - name: Удалить одноразовый workflow
        run: |
          set -eu
          git rm .github/workflows/finalize-v1.8.4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove one-time v1.8.4 release workflow"
          git push origin HEAD:main
