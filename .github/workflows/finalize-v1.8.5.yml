name: Finalize v1.8.5

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-v1.8.5.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить манифест и файлы релиза
        run: |
          set -eu
          . ./RELEASE
          test "$VERSION" = "1.8.5"
          test "$COMMIT" = "cb1e46678e2b72437fde4abce52cf9b82b7e3416"
          test "$WATCHDOG_SHA256" = "e094f23bd5d6bb1930d14640a54aac057d218a92c7ce568da683cb0cfc6838d6"
          test "$MANAGER_SHA256" = "ac4d337dc77f818b2360a17fa61cc39b8caabea3c73b2f755c9896cb762c8bfc"
          git cat-file -e "$COMMIT^{commit}"
          test "$(git show "$COMMIT:wg-watchdog.sh" | sha256sum | awk '{print $1}')" = "$WATCHDOG_SHA256"
          test "$(git show "$COMMIT:wg-watchdog-manager.sh" | sha256sum | awk '{print $1}')" = "$MANAGER_SHA256"
          grep -Fx 'VERSION="1.8.5"' install.sh
          grep -Fx 'VERSION="1.8.5"' wg-watchdog-manager.sh
          grep -Fx 'VERSION="1.8.5"' wg-watchdog.sh

      - name: Запустить тесты
        run: |
          set -eu
          sh -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          dash -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          bash -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          busybox ash -n install.sh
          busybox ash -n wg-watchdog-manager.sh
          busybox ash -n wg-watchdog.sh
          busybox ash -n tests/run.sh
          shellcheck -S error install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          sudo dash tests/run.sh
          python3 tests/terminal.py

      - name: Создать аннотированный тег и релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.8.5 "$GITHUB_SHA" -m "WG Watchdog v1.8.5"
          git push origin refs/tags/v1.8.5
          gh release create v1.8.5 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WG Watchdog v1.8.5" \
            --notes "$(printf '%s\n' \
              '- Главное меню реорганизовано вокруг WireGuard-интерфейсов: после выбора все действия выполняются без повторного выбора задания.' \
              '- Для настроенного интерфейса добавлено отдельное контекстное меню; для ненастроенного предлагается только создание watchdog.' \
              '- Добавлен просмотр последних 20 событий выбранного задания из системного журнала KeeneticOS без постоянного лог-файла.' \
              '- Добавлен подтверждаемый принудительный перезапуск интерфейса с паузой из настроек и аварийной попыткой вернуть интерфейс в up.' \
              '- Удаление однозначно удаляет только задание watchdog и не затрагивает конфигурацию WireGuard.' \
              '- Настроенные задания для временно отсутствующих интерфейсов остаются доступны в главном меню.' \
              '- Подтверждение установки обновления использует [Y/n]: Enter выбирает установку; явный n отменяет её.' \
              '- Пройдены 92 функциональные и 7 терминальных проверок, BusyBox ash и ShellCheck.')"

      - name: Удалить одноразовый workflow
        run: |
          set -eu
          git rm .github/workflows/finalize-v1.8.5.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove one-time v1.8.5 release workflow"
          git push origin HEAD:main
