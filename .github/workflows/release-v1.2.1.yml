name: Release v1.2.1 and refresh release notes

on:
  push:
    paths:
      - .github/workflows/release-v1.2.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create structured release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 96fae847d9a9b7fabd5943c64339d7b1b831ae3f
        run: |
          cat > /tmp/v1.0.0.md <<'EOF'
          ## Изменения

          - Добавлен интерактивный установщик на русском языке.
          - Реализован поиск WireGuard-интерфейсов Keenetic и вывод их описаний.
          - Добавлена проверка внутреннего адреса WireGuard-сервера.
          - Настраиваются число ping-запросов, тайм-аут и задержка перезапуска.
          - Автоматически устанавливается и настраивается cron в Entware.
          - Интерфейс не перезапускается при отсутствии обычного интернета.
          - Добавлено журналирование перезапусков и ошибок.
          EOF

          cat > /tmp/v1.1.0.md <<'EOF'
          ## Изменения

          - Добавлена поддержка нескольких независимых заданий для разных WireGuard-интерфейсов.
          - Реализовано меню добавления, изменения, включения, выключения и удаления заданий.
          - Добавлен ручной запуск выбранной проверки.
          - Добавлена настраиваемая частота проверки с интервалом 5 минут по умолчанию.
          - Для каждого интерфейса используется отдельная конфигурация и отдельная строка cron.
          - Добавлена автоматическая миграция конфигурации v1.0.0.
          - Добавлены резервное копирование crontab и защита от параллельных запусков.
          EOF

          cat > /tmp/v1.2.0.md <<'EOF'
          ## Изменения

          - Добавлен порог последовательных ошибок перед перезапуском интерфейса.
          - Добавлен cooldown между повторными перезапусками.
          - Добавлена пауза после загрузки роутера.
          - Реализована необязательная проверка публичного адреса WireGuard-сервера.
          - Добавлен подробный статус каждого задания.
          - Ограничены допустимые значения параметров и используются точные интервалы cron.
          - Состояние задания сбрасывается при новой загрузке роутера.
          - Добавлена автоматическая миграция конфигураций предыдущих версий.
          - Добавлен mock-стенд из 17 автоматических сценариев.
          EOF

          cat > /tmp/v1.2.1.md <<'EOF'
          ## Изменения

          - Часто изменяющееся состояние и блокировки перенесены с /opt в оперативную память /tmp.
          - Временные загрузки программы также перенесены в /tmp.
          - Неизменившиеся скрипты, конфигурации и crontab больше не перезаписываются.
          - Повторяющиеся одинаковые ошибки записываются в журнал только при смене состояния.
          - Старые файлы состояния v1.2.0 автоматически удаляются из /opt/var/lib/wg-watchdog.
          - Установленная часть проекта занимает около 38 КБ.
          - Набор автоматических mock-тестов расширен до 21 сценария.
          EOF

          gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --title "WG Watchdog v1.0.0" --notes-file /tmp/v1.0.0.md
          gh release edit v1.1.0 --repo "$GITHUB_REPOSITORY" --title "WG Watchdog v1.1.0" --notes-file /tmp/v1.1.0.md
          gh release edit v1.2.0 --repo "$GITHUB_REPOSITORY" --title "WG Watchdog v1.2.0" --notes-file /tmp/v1.2.0.md

          if gh release view v1.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.2.1 --repo "$GITHUB_REPOSITORY" --title "WG Watchdog v1.2.1" --notes-file /tmp/v1.2.1.md
          else
            gh release create v1.2.1 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "WG Watchdog v1.2.1" \
              --notes-file /tmp/v1.2.1.md
          fi
