name: Release v1.5.3
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.5.3.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить версию и тесты
        run: |
          test "$(cat VERSION)" = "1.5.3"
          sh -n install.sh
          sh -n wg-watchdog-manager.sh
          sh -n wg-watchdog.sh
          sudo dash tests/run.sh
          python3 tests/terminal.py
      - name: Создать тег и релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ac82b9b82ba3eaaebdee49166999a5071c496b30
        run: |
          gh release create v1.5.3 --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "WG Watchdog v1.5.3" --notes "$(printf '%s\n' \
            '- Исправлен запуск на BusyBox без поддержки stat -c: владелец и права читаются через LC_ALL=C ls -ldn.' \
            '- Удалено ошибочное сравнение владельца с /opt или файлом менеджера; рабочие каталоги должны принадлежать root.' \
            '- Сохранён запрет каталогов-ссылок и записи для группы или остальных пользователей.' \
            '- Добавлены проверки отказа stat, чужого владельца, небезопасных прав и ошибки ls.' \
            '- Исправлены неверные объяснения причины сбоя в ROADMAP.' \
            '- Пройдены 56 функциональных и 6 терминальных проверок.')"
      - name: Удалить одноразовый workflow
        run: |
          git rm .github/workflows/release-v1.5.3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove one-time v1.5.3 release workflow"
          git push origin HEAD:main
