name: Finalize public v1.0.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-public-v1.0.0.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить выпуск
        run: |
          set -eu
          . ./RELEASE
          test "$VERSION" = "1.0.0"
          test "$COMMIT" = "cc1238d1e57293620f3cb5d85a70360a9e1970aa"
          git cat-file -e "$COMMIT^{commit}"
          test "$(git show "$COMMIT:wg-watchdog.sh" | sha256sum | awk '{print $1}')" = "$WATCHDOG_SHA256"
          test "$(git show "$COMMIT:wg-watchdog-manager.sh" | sha256sum | awk '{print $1}')" = "$MANAGER_SHA256"
          grep -Fx 'VERSION="1.0.0"' install.sh
          grep -Fx 'VERSION="1.0.0"' wg-watchdog-manager.sh
          grep -Fx 'VERSION="1.0.0"' wg-watchdog.sh

      - name: Запустить тесты
        run: |
          set -eu
          sh -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          dash -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          busybox ash -n install.sh
          busybox ash -n wg-watchdog-manager.sh
          busybox ash -n wg-watchdog.sh
          busybox ash -n tests/run.sh
          shellcheck -S error install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          sudo dash tests/run.sh
          python3 tests/terminal.py

      - name: Очистить прежние релизы и теги
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].id' | while IFS= read -r release_id; do
              [ -n "$release_id" ] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            done
          git tag -l | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            git push origin ":refs/tags/$tag"
          done

      - name: Очистить Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git clone "$wiki_url" wiki-cleanup
          cd wiki-cleanup
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git ls-files -z | xargs -0 -r git rm --
          if ! git diff --cached --quiet; then
            git commit -m "Remove obsolete Wiki documentation"
            git push origin HEAD
          fi

      - name: Создать чистый релиз v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          release_commit=$(git rev-parse HEAD^)
          git tag -a v1.0.0 "$release_commit" -m "WG Watchdog Manager v1.0.0"
          git push origin refs/tags/v1.0.0
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WG Watchdog Manager v1.0.0" \
            --notes "$(printf '%s\n' \
              '- Автоматическое восстановление клиентских WireGuard-интерфейсов на KeeneticOS.' \
              '- Отдельные правила и расписание для каждого интерфейса.' \
              '- Полноэкранное управление, ручная проверка, статус и последние события.' \
              '- Безопасные обновления с проверкой SHA-256 и откатом.' \
              '- Состояние хранится в RAM без частых записей на накопитель Entware.')"

      - name: Удалить одноразовый workflow
        run: |
          set -eu
          git rm .github/workflows/finalize-public-v1.0.0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove one-time public v1.0.0 workflow"
          git push origin HEAD:main
