name: Publish WG Watchdog Wiki once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-wiki-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish prepared Wiki pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          cd wiki-repo
          printf '%s' '' | base64 -d > 'Home.md'
          printf '%s' '' | base64 -d > 'Installation.md'
          printf '%s' '' | base64 -d > 'Configuration.md'
          printf '%s' '' | base64 -d > 'Diagnostics.md'
          printf '%s' '' | base64 -d > 'Uninstall.md'
          printf '%s' '' | base64 -d > 'Troubleshooting.md'
          printf '%s' '' | base64 -d > 'Development.md'
          printf '%s' '' | base64 -d > '_Sidebar.md'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Home.md Installation.md Configuration.md Diagnostics.md Uninstall.md Troubleshooting.md Development.md _Sidebar.md
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git commit -m "Publish WG Watchdog documentation"
          git push origin HEAD:master
