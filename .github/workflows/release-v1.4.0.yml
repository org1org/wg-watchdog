name: Release v1.4.0

on:
  push:
    paths:
      - .github/workflows/release-v1.4.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release v1.4.0
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 4a50395c1077730361baf28ea53f33faae8f7665
        run: |
          cat > /tmp/v1.4.0.md <<'EOF'
          ## Изменения

          - Команда `wgwm` теперь открывает менеджер сразу, без вопроса о продолжении.
          - Подтверждение `[Y/n]` оставлено только для первой установки.
          - После первой установки выводится краткое резюме с установленными файлами и командами управления.
          - После установки менеджер больше не запускается автоматически.
          - Повторный запуск установочной команды не скачивает файлы, а открывает существующий менеджер.
          - Добавлены ключи `--force` и `-force` для принудительной переустановки.
          - Новое задание получает рекомендуемый числовой профиль без серии дополнительных вопросов.
          - После создания задания показываются применённые параметры и способ их изменения.
          - В меню добавлено полное удаление WG Watchdog с сохранением сторонних строк cron.
          - Пакеты `cron`, `ndmq` и резервная копия crontab при удалении сохраняются.
          - Добавлена проверка совпадения версий загруженных скриптов перед их заменой.
          - Автоматический стенд расширен до 38 проверок, включая полный жизненный цикл установки и удаления.
          EOF

          gh release create v1.4.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "WG Watchdog v1.4.0" \
            --notes-file /tmp/v1.4.0.md
