name: Finalize v1.7.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v1.7.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check shell syntax
        run: |
          sh -n install.sh
          sh -n wg-watchdog-manager.sh
          sh -n wg-watchdog.sh
          dash -n install.sh
          dash -n wg-watchdog-manager.sh
          dash -n wg-watchdog.sh

      - name: Run functional tests
        run: sudo dash tests/run.sh

      - name: Run terminal tests
        run: python3 tests/terminal.py

      - name: Verify immutable payload
        env:
          PAYLOAD_SHA: 084c140ba1f0b20be9af33848aceea82226eadbb
        run: |
          set -eu
          test "$(sed -n 's/^VERSION=//p' RELEASE)" = "1.7.0"
          test "$(sed -n 's/^COMMIT=//p' RELEASE)" = "$PAYLOAD_SHA"
          test "$(git show "$PAYLOAD_SHA:wg-watchdog.sh" | sha256sum | awk '{print $1}')" = "$(sed -n 's/^WATCHDOG_SHA256=//p' RELEASE)"
          test "$(git show "$PAYLOAD_SHA:wg-watchdog-manager.sh" | sha256sum | awk '{print $1}')" = "$(sed -n 's/^MANAGER_SHA256=//p' RELEASE)"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 629f12e81bab3c26911dacf78686fa8be5aee797
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cat-file -e "$TARGET_SHA^{commit}"
          if git rev-parse -q --verify refs/tags/v1.7.0 >/dev/null; then
            test "$(git rev-list -n 1 v1.7.0)" = "$TARGET_SHA"
          else
            git tag -a v1.7.0 "$TARGET_SHA" -m "WG Watchdog v1.7.0"
            git push origin refs/tags/v1.7.0
          fi
          cat > release-notes.md <<'EOF'
          - Новые задания больше не проверяют 1.1.1.1 и 8.8.8.8 по умолчанию, поэтому full-tunnel не блокирует собственное восстановление.
          - Старые задания сохраняют прежнюю сетевую логику; режим внешней проверки можно изменить в менеджере.
          - Cooldown рассчитывается по монотонному времени /proc/uptime и не сбрасывается при переводе системных часов.
          - Ручная проверка всегда показывает результат, не дублируя неизменившееся состояние в syslog.
          - Подтверждение Enter перенесено непосредственно под результат действия.
          - При удалении можно сохранить конфигурации заданий для последующей переустановки или удалить всё полностью.
          - Основной README сокращён, подробная русская документация перенесена в GitHub Wiki.
          - Пройдены 71 функциональный сценарий и 6 PTY-проверок интерфейса.
          EOF
          if gh release view v1.7.0 >/dev/null 2>&1; then
            gh release edit v1.7.0 --title "WG Watchdog v1.7.0" --notes-file release-notes.md
          else
            gh release create v1.7.0 --verify-tag --title "WG Watchdog v1.7.0" --notes-file release-notes.md
          fi
