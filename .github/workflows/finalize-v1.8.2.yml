name: Finalize v1.8.2

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-v1.8.2.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить манифест и файлы релиза
        run: |
          set -eu
          . ./RELEASE
          test "$VERSION" = "1.8.2"
          test "$COMMIT" = "61c4b110cff4322c6693558aa2d6a7466ba7ecdc"
          test "$WATCHDOG_SHA256" = "76212d1be0cbe0161c1356842bc2109133673b87f89729f5e7021ae5bc53f481"
          test "$MANAGER_SHA256" = "804309ce05125feab385378b8c00dd913e139083459051112c7b2414f45580da"
          git cat-file -e "$COMMIT^{commit}"
          test "$(git show "$COMMIT:wg-watchdog.sh" | sha256sum | awk '{print $1}')" = "$WATCHDOG_SHA256"
          test "$(git show "$COMMIT:wg-watchdog-manager.sh" | sha256sum | awk '{print $1}')" = "$MANAGER_SHA256"
          grep -Fx 'VERSION="1.8.2"' install.sh
          grep -Fx 'VERSION="1.8.2"' wg-watchdog-manager.sh
          grep -Fx 'VERSION="1.8.2"' wg-watchdog.sh

      - name: Запустить тесты
        run: |
          set -eu
          sh -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          dash -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          bash -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          sudo dash tests/run.sh
          python3 tests/terminal.py

      - name: Создать аннотированный тег и релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.8.2 "$GITHUB_SHA" -m "WG Watchdog v1.8.2"
          git push origin refs/tags/v1.8.2
          gh release create v1.8.2 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WG Watchdog v1.8.2" \
            --notes "$(printf '%s\n' \
              '- Установщик теперь сразу проверяет и устанавливает ndmq и cron.' \
              '- Установщик включает автозапуск cron и запускает службу до завершения установки.' \
              '- В списке WireGuard-интерфейсов описание всегда расположено перед статусом задания.' \
              '- Контрольные IP/DNS-адреса запрашиваются только при включённой проверке обычного интернета.' \
              '- Доступное обновление выделяется зелёным; отображение проверяется в настоящем PTY.' \
              '- Пройдены 85 функциональных и 7 терминальных проверок.')"

      - name: Удалить одноразовый workflow
        run: |
          set -eu
          git rm .github/workflows/finalize-v1.8.2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove one-time v1.8.2 release workflow"
          git push origin HEAD:main
