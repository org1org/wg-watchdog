name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install test shells and ShellCheck
        run: sudo apt-get update && sudo apt-get install -y busybox shellcheck

      - name: Check POSIX shell syntax
        run: |
          for script in install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh; do
            sh -n "$script"
            dash -n "$script"
            busybox ash -n "$script"
          done

      - name: Run static analysis
        run: shellcheck --shell=sh --severity=error install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh

      - name: Run functional tests with sh
        run: sudo sh tests/run.sh

      - name: Run functional tests with dash
        run: sudo env TEST_WORKER_SHELL=dash dash tests/run.sh

      - name: Run functional tests with BusyBox ash
        run: |
          printf '#!/bin/sh\nexec busybox ash "$@"\n' > /tmp/wgwm-test-ash
          chmod +x /tmp/wgwm-test-ash
          sudo env TEST_WORKER_SHELL=/tmp/wgwm-test-ash busybox ash tests/run.sh

      - name: Run terminal tests
        run: python3 tests/terminal.py
