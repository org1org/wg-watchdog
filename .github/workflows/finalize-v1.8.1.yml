name: Finalize v1.8.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-v1.8.1.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release candidate
        env:
          RELEASE_COMMIT: 56030a1dee6016c977dca1894e872d4448083e68
          WATCHDOG_SHA256: f7929f2462edf423173cc08e22a9186182f96e990e5001491af4cc6ce341b07d
          MANAGER_SHA256: 50317b297c27638ec3051d96d54d0a0b443307cecd43088a6cfa773096d82a8b
        run: |
          test "$(sed -n 's/^VERSION=//p' RELEASE)" = "1.8.1"
          test "$(sed -n 's/^COMMIT=//p' RELEASE)" = "$RELEASE_COMMIT"
          test "$(sed -n 's/^WATCHDOG_SHA256=//p' RELEASE)" = "$WATCHDOG_SHA256"
          test "$(sed -n 's/^MANAGER_SHA256=//p' RELEASE)" = "$MANAGER_SHA256"
          test "$(git show "$RELEASE_COMMIT:wg-watchdog.sh" | sha256sum | awk '{print $1}')" = "$WATCHDOG_SHA256"
          test "$(git show "$RELEASE_COMMIT:wg-watchdog-manager.sh" | sha256sum | awk '{print $1}')" = "$MANAGER_SHA256"
          sh -n install.sh wg-watchdog-manager.sh wg-watchdog.sh tests/run.sh
          sudo dash tests/run.sh
          python3 tests/terminal.py

      - name: Create annotated tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 23cad320f48fae956b1a74333ea605b2e5bd5363
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.8.1 "$TARGET_SHA" -m "WG Watchdog v1.8.1"
          git push origin v1.8.1
          cat > /tmp/release-notes.md <<'EOF'
          ## Изменения

          - Пункт обновления выделяется зелёным, когда найдена новая версия программы.
          - Два контрольных адреса проверки интернета теперь настраиваются отдельно для каждого задания.
          - В качестве контрольных адресов можно использовать IPv4, IPv6 или DNS-имена.
          - Ответ любого из двух адресов подтверждает доступность интернета; только отказ обоих блокирует перезапуск WireGuard.
          - Старые задания автоматически сохраняют прежние адреса `1.1.1.1` и `8.8.8.8`.
          - Контрольные адреса добавлены в подробный статус задания.
          - Ранние предупреждения менеджера приведены к единому цветному формату.
          - Автоматический стенд расширен до 85 функциональных и 6 терминальных проверок.
          EOF
          gh release create v1.8.1 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WG Watchdog v1.8.1" \
            --notes-file /tmp/release-notes.md

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/finalize-v1.8.1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove one-time v1.8.1 release workflow"
          git push origin HEAD:main
